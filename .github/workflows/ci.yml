name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64

      - name: Install the pinned requirements
        run: python -m pip install -r requirements/build.txt

      - name: Fetch the offline speech recogniser (pinned, SHA-256 verified)
        run: python windows/fetch_speech.py

      - name: Run the test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: utf-8
        run: python -m pytest -p no:cacheprovider
