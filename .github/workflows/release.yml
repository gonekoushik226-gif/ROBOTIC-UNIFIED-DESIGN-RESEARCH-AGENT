name: Release

# Builds, tests and publishes a DRAFT release for a version tag (v1.0.0, ...).
# The draft is published by hand after review; only published stable releases are
# offered by RUDRA's update notice.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64

      - name: Install the pinned build requirements
        run: python -m pip install -r requirements/build.txt

      - name: Fetch the offline speech recogniser (pinned, SHA-256 verified)
        run: python windows/fetch_speech.py

      - name: Read the application version
        run: |
          $version = python -c "from app.version import VERSION; print(VERSION)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match the application version $version (app/version.py)."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: utf-8
        run: python -m pytest -p no:cacheprovider

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build, self-test and check the application, and build the installer
        run: python windows/build.py --skip-tests --installer

      - name: Build a higher-versioned installer of the same program, for the upgrade test
        run: python -c "import sys; sys.path.insert(0, '.'); from pathlib import Path; from windows.build import build_installer; build_installer('$env:VERSION.1', Path('build/upgrade-test'))"

      - name: Test the installer (install, use offline, upgrade, uninstall)
        run: python windows/test_installer.py "dist/installer/RUDRA-Setup-$env:VERSION-win64.exe" --upgrade-to "build/upgrade-test/RUDRA-Setup-$env:VERSION.1-win64.exe"

      - name: Check the release files
        run: |
          $files = Get-ChildItem dist/installer | Select-Object -ExpandProperty Name | Sort-Object
          $expected = @("RUDRA-Setup-$env:VERSION-win64.exe", "SHA256SUMS.txt") | Sort-Object
          if (Compare-Object $files $expected) { throw "Unexpected release files: $($files -join ', ')" }
          Get-Content dist/installer/SHA256SUMS.txt
          python -c "import sys; sys.path.insert(0, '.'); from pathlib import Path; from windows.build import sha256; line = Path('dist/installer/SHA256SUMS.txt').read_text().split(); assert sha256(Path('dist/installer') / line[1]) == line[0], 'checksum mismatch'"

      - name: Write the release notes
        run: python windows/release_notes.py $env:VERSION > build/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: RUDRA-${{ env.VERSION }}-windows
          path: |
            dist/installer/RUDRA-Setup-${{ env.VERSION }}-win64.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @("dist/installer/RUDRA-Setup-$env:VERSION-win64.exe", "dist/installer/SHA256SUMS.txt")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --title "RUDRA $env:VERSION" --notes-file build/release-notes.md
          }
